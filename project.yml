name: SceneCapture
options:
  bundleIdPrefix: dev.iphonersa
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SceneCapture:
    type: application
    platform: iOS
    sources: [app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iphonersa.SceneCapture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scene Capture
        INFOPLIST_KEY_NSCameraUsageDescription: Record synchronized cameras and LiDAR depth for scene and hand reconstruction.
        INFOPLIST_KEY_NSMotionUsageDescription: Record motion sensor samples alongside the cameras for offline camera tracking.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '4'
  SceneCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/ios]
    dependencies:
      - target: SceneCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SceneCapture:
    build:
      targets:
        SceneCapture: all
    test:
      targets: [SceneCaptureTests]

